---
- name: deploy EC2 instance
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    region: us-east-1
    instance_type: t3.small
    ami_id: ami-0152204c1a187337c
    key_name: ansible-key
    vpc_id: vpc-06d3125725d6aaaa0
    subnet_id: subnet-0251f9740e1a65f16

  tasks:
    - name: Launch ec2 instance
      amazon.aws.ec2_instance:
        name: "minecraft-server"
        region: "{{ region }}"
        instance_type: "{{ instance_type }}"
        image_id: "{{ ami_id }}"
        key_name: "{{ key_name }}"
        vpc_subnet_id: "{{ subnet_id }}"
        security_group: "sg-0d9a5bd0a5b815cac"
        network:
          assign_public_ip: true
        state: running
      register: ec2 #save info about the instance
    - name: wait until ssh is avaliable
      wait_for:
        host: "{{ ec2.instances[0].public_ip_address }}"
        port: 22
        delay: 10
        timeout: 120
    - name: add instance to ansible inventory
      add_host:
        hostname: "{{ ec2.instances[0].public_ip_address }}"
        groups: minecraft-servers
        ansible_user: ec2-user
        ansible_ssh_private_key_file: ~/.ssh/ansible-key.pem
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no' #so that the host is automatically trusted



        
